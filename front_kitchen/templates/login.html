<!DOCTYPE html>
<html lang="en" data-bs-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Spicy Chowk | Manager Login</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <style>
        body { background-color: #0f0f11; font-family: 'Inter', sans-serif; height: 100vh; display: flex; align-items: center; justify-content: center;}
        .login-card { background: #1a1a1d; padding: 40px; border-radius: 20px; border: 1px solid #2c2c31; width: 100%; max-width: 400px; text-align: center; }
        .pin-input { font-size: 2rem; letter-spacing: 15px; text-align: center; background: #0f0f11; border: 1px solid #2c2c31; color: white; border-radius: 12px; height: 70px; }
        .pin-input:focus { border-color: #e63946; box-shadow: 0 0 0 4px rgba(230, 57, 70, 0.15); outline: none; }
    </style>
</head>
<body>
    <div class="login-card shadow-lg">
        <i class="bi bi-fire fs-1" style="color: #e63946;"></i>
        <h3 class="fw-bold text-white mt-3 mb-1">OpsHub Login</h3>
        <p class="text-muted mb-4 small">Enter manager PIN to access back office.</p>

        {% with messages = get_flashed_messages() %}
          {% if messages %}
            {% for message in messages %}
              <div class="alert alert-danger border-0 small py-2">{{ message }}</div>
            {% endfor %}
          {% endif %}
        {% endwith %}

        <form action="{{ url_for('login') }}" method="POST">
            <input type="password" class="form-control pin-input mb-4" name="pin" maxlength="4" required autofocus autocomplete="off">
            <button type="submit" class="btn btn-danger w-100 fw-bold py-3 rounded-pill" style="background-color: #e63946; border: none;">Unlock Dashboard</button>
        </form>
        <a href="/" class="d-block mt-4 text-muted small text-decoration-none"><i class="bi bi-arrow-left"></i> Return to Kitchen</a>
    </div>
</body>
</html>
